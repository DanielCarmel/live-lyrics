[project]
name = "live-lyrics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "rapidfuzz>=3.14.6",
    "shazamio>=0.9.0",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
live-lyrics = "live_lyrics.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["live_lyrics"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
